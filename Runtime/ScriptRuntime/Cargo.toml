[package]
name = "native-script-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs one untrusted script in a V8 isolate; every effect goes through tools the host binds."

[[bin]]
name = "native-script-runtime"
path = "src/main.rs"

[features]
# V8's memory sandbox. Needs V8 built from source: scripts/build-script-runtime.sh --sandbox.
sandbox = ["v8/v8_enable_sandbox"]

[dependencies]
v8 = { version = "=150.4.0", features = ["v8_enable_pointer_compression"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
lto = "thin"
# Strip the staged helper with Xcode's tool in scripts/build-script-runtime.sh. Rust 1.99.0's
# bundled rust-objcopy cannot find libLLVM.dylib on macOS and only warns when stripping fails.
strip = false
panic = "abort"
