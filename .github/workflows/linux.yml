# Builds the host on Linux and runs the tests that run there, so the host stays portable
# (docs/durability.md, "Any machine can be a host"). The app and the host's Mac-only parts
# (NativeHostMac) never build here.
#
# What's still Mac-only on a Linux host, the cryptography that waits for swift-crypto included, is in
# docs/durability.md. Tests of those features are macOS-only, so the rest run here.
#
# Not required yet: each job reports without failing the run. Make it required once it's been green
# on main for a few days: drop `continue-on-error` and add both jobs to the branch's required checks.
name: Linux

on:
  push:
    branches: [main]
  # The host and every package it builds with. Exec, Git and the others reach it through
  # Packages/NativeHost/Package.swift.
  pull_request:
    paths:
      - Packages/NativeHost/**
      - Packages/ACP/**
      - Packages/Exec/**
      - Packages/Orchestration/**
      - Packages/MCPServer/**
      - Packages/SessionTitling/**
      - Packages/AIInstructions/**
      - Packages/Git/**
      - .github/workflows/linux.yml
  # Run by hand on any branch: `gh workflow run linux.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host on Linux (${{ matrix.arch }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The Swift the app builds with (Xcode 27.1 ships 6.4), so Linux checks the same language.
    container:
      image: swift:6.4
      # Crash-recovery tests orphan grandchildren; reap them as a normal host's init would.
      options: --init
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The host's store is SQLite: Apple's SDKs have it as a module, Linux needs the headers
      # (Packages/NativeHost/Sources/CSQLite).
      - name: Install SQLite's headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      # The image's tag follows 6.4's patch releases, and builds from another compiler can't be reused.
      - name: Compiler version
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -n 1 | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache package builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Packages/NativeHost/.build
            Packages/ACP/.build
          key: spm-linux-${{ matrix.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: spm-linux-${{ matrix.arch }}-${{ steps.swift.outputs.version }}-

      # A real host runs as a user. Root bypasses the directory-permission checks in the tests.
      # Use one user for every SwiftPM command so its build locks belong to that user too.
      - name: Prepare build user
        run: |
          useradd --create-home native-test
          chown -R native-test:native-test "$GITHUB_WORKSPACE"

      # The steps after a failure still run, so one run reports every break.
      - name: Build native-host
        id: build
        run: runuser -u native-test -- swift build -c release --package-path Packages/NativeHost --product native-host --static-swift-stdlib
      - name: Test ACP
        if: ${{ !cancelled() }}
        run: runuser -u native-test -- swift test --package-path Packages/ACP
      # Only the test product and what it depends on: `swift test` on its own builds every target,
      # NativeHostMac included.
      - name: Test NativeHost
        if: ${{ !cancelled() }}
        run: runuser -u native-test -- swift test --package-path Packages/NativeHost --test-product NativeHostPackageTests

      - name: Name the binary
        id: binary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cp "$(runuser -u native-test -- swift build -c release --package-path Packages/NativeHost --show-bin-path)/native-host" \
            "native-host-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.binary.outcome == 'success' }}
        with:
          name: native-host-linux-${{ matrix.arch }}
          path: native-host-linux-${{ matrix.arch }}
          retention-days: 7
