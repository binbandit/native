name: Systemd user unit

on:
  pull_request:
    paths:
      - "scripts/host/**"
      - "docs/linux-user-service.md"
      - ".github/workflows/systemd-unit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/host/**"
      - "docs/linux-user-service.md"
      - ".github/workflows/systemd-unit.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify systemd user unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: systemd-analyze --version
      - run: python3 -m unittest discover -s scripts/host/tests -p "test_systemd_unit.py" -v
