# Builds what runs on iPad and iPhone, which the Mac's builds never compile for iOS: the iPhone
# companion for the simulator, every package that declares iOS, and the app folders that already
# compile for iPad (scripts/check-ios.sh). Our own files build without warnings there too.
#
# Daily and on demand (`gh workflow run ios.yml --ref <branch>`), and on pull requests that touch code
# the iPad or iPhone compiles. Not on pushes: those already take most of the repository's five macOS
# runners (docs/releasing.md, "How CI stays quick").
name: iOS

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  pull_request:
    paths:
      - Companion/**
      - Packages/**
      - native/DesignSystem/**
      - native/Platform/**
      - native/Views/Transcript/**
      - native/Celebrations/**
      - scripts/check-ios.sh
      - scripts/check-warnings.sh
      - scripts/ci/build-packages-ios.sh
      - scripts/ci/setup-git-lfs.sh
      - scripts/companion/**
      - design/app-icon/**
      - native/AppIcon.icon/**
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # One runner for all three, so a pull request that runs this takes one more at most.
    name: Build for iOS
    runs-on: ${{ vars.CI_MACOS_RUNNER || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      # The companion's icons are rendered from the icon work's documents, whose images are in Git
      # LFS (scripts/companion/app-icons.sh). Only these are fetched, about 50 MB, and kept in a cache.
      ICON_ARTWORK: design/app-icon/channel-themes/*/stable.icon/**,design/app-icon/celebrations/*/stable.icon/**
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Cache locations
        run: |
          echo "SOURCE_PACKAGES=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          echo "COMPILATION_CACHE=$RUNNER_TEMP/CompilationCache" >> "$GITHUB_ENV"
      - name: Cache the icon artwork
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs/objects
          # The checkout has LFS pointers, so this hash changes only when the artwork does.
          key: lfs-icon-artwork-${{ hashFiles('design/app-icon/channel-themes/*/stable.icon/**', 'design/app-icon/celebrations/*/stable.icon/**') }}
          restore-keys: lfs-icon-artwork-
      - name: Ensure Git LFS is available
        run: scripts/ci/setup-git-lfs.sh
      - name: Fetch the icon artwork
        run: git lfs pull --include "$ICON_ARTWORK"
      # The Mac builds' package checkouts, which pin everything these builds use (tree-sitter and its
      # grammars, Sentry) at the same versions. Restored only: the repository's caches are full of the
      # Mac builds' own, and a daily build's would only push theirs out.
      - name: Restore Swift package checkouts
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: source-packages-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: source-packages-v2-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-

      # The three builds run whatever the one before did, so one run reports every break. Xcode's
      # compilation cache (scripts/release/check.sh explains it) lasts for the run only: the packages
      # share dependencies (ACP, Exec), and with it each compiles once instead of once per package.
      - name: Build the companion for the iOS Simulator
        run: |
          xcodebuild build -project Companion/NativeCompanion.xcodeproj -scheme NativeCompanion -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Companion" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE" \
            COMPILATION_CACHE_LIMIT_SIZE=2G > "$RUNNER_TEMP/companion.log" 2>&1 || {
              grep -E '^[^[:space:]|].*error: ' "$RUNNER_TEMP/companion.log" | sort -u
              tail -n 30 "$RUNNER_TEMP/companion.log"
              exit 1
            }
          scripts/check-warnings.sh "$RUNNER_TEMP/companion.log"
      - name: Build the packages for the iOS Simulator
        if: ${{ !cancelled() }}
        run: >-
          scripts/ci/build-packages-ios.sh --derived-data "$RUNNER_TEMP/Packages"
          --source-packages "$SOURCE_PACKAGES" --compilation-cache "$COMPILATION_CACHE"
      # The app has no iPadOS destination yet. The design system and the platform adapters compile
      # for it on their own; docs/releasing.md ("iOS checks") says what keeps the rest from it.
      - name: Typecheck the app for iPadOS
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          # native/DesignSystem always comes along.
          scripts/check-ios.sh native/Platform 2>&1 | tee "$RUNNER_TEMP/ipad.log"
          scripts/check-warnings.sh "$RUNNER_TEMP/ipad.log"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/companion.log
            ${{ runner.temp }}/Packages/*.log
          if-no-files-found: ignore
