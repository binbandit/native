# Compiles the Release and Nightly configurations, so a break that only shows up outside Debug is
# caught before a release needs it. Like a release, it builds the terminal and the script runtime for
# real and fails without them (check.sh). Every push to main runs it. A pull request runs it only when
# it changes what Release and Nightly build differently (settings, the project, the embedded helpers,
# the release scripts): the two jobs are a third of a PR's macOS time, and CI's macOS runners are
# shared by every open PR.
name: Check

on:
  pull_request:
    paths:
      - "Config/**"
      - "native.xcodeproj/**"
      - "NativeHostHelper/**"
      - "Runtime/**"
      - "scripts/build-*.sh"
      - "scripts/release/**"
      - ".github/workflows/check.yml"
  push:
    branches: [main]
  # Run by hand on any branch: `gh workflow run <file> --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-configurations:
    # Release and Nightly build side by side, each on its own runner.
    name: Check ${{ matrix.configuration }}
    runs-on: ${{ vars.CI_MACOS_RUNNER || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Nightly]
    env:
      DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Cache locations
        run: |
          echo "SOURCE_PACKAGES=$HOME/Library/Caches/native-ci/SourcePackages" >> "$GITHUB_ENV"
          echo "COMPILATION_CACHE=$HOME/Library/Caches/native-ci/CompilationCache" >> "$GITHUB_ENV"
      # The same caches as the release workflows, so a release finds what main's checks built.
      - name: Cache libghostty
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/native-build/libghostty
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty.sh') }}
          restore-keys: libghostty-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the script runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Native/ScriptRuntime
          key: script-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Runtime/ScriptRuntime/Cargo.lock', 'Runtime/ScriptRuntime/rust-toolchain.toml', 'scripts/build-script-runtime.sh') }}
          restore-keys: script-runtime-${{ runner.os }}-${{ runner.arch }}-
      # Package checkouts and binary artifacts, keyed by what the project pins: about 25 s to restore
      # where resolving from nothing took 3.5 minutes.
      - name: Cache Swift package checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SOURCE_PACKAGES }}
          key: source-packages-${{ runner.os }}-${{ hashFiles('native.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: source-packages-${{ runner.os }}-
      # Xcode's compilation cache (check.sh --compilation-cache). Restored from the newest run; saved
      # again only from main, so pull requests read it without crowding the repository's caches.
      - name: Restore the compilation cache
        id: compilation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILATION_CACHE }}
          key: compilation-cache-${{ runner.os }}-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: compilation-cache-${{ runner.os }}-${{ matrix.configuration }}-
      # Only the versions Package.resolved records: a resolved file that no longer matches the project
      # fails here instead of being re-resolved to whatever the remotes have now.
      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies -project native.xcodeproj -scheme native
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" -disableAutomaticPackageResolution -quiet
      - name: Build ${{ matrix.configuration }}
        run: |
          set -o pipefail
          scripts/release/check.sh --derived-data "$RUNNER_TEMP/DerivedData" --source-packages "$SOURCE_PACKAGES" \
            --compilation-cache "$COMPILATION_CACHE" "${{ matrix.configuration }}" 2>&1 | tee "$RUNNER_TEMP/build.log"
      # Like the Debug build in ci.yml, these build without warnings.
      - name: No warnings
        run: scripts/check-warnings.sh "$RUNNER_TEMP/build.log"
      - name: Save the compilation cache
        if: success() && github.event_name != 'pull_request' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.COMPILATION_CACHE }}
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
