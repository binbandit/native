# Builds Native Nightly from main every night and publishes it to the rolling "nightly" release.
# docs/releasing.md explains the release flow and the secrets this uses.
name: Nightly

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if main hasn't changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    # Needs Xcode with the macOS 27 SDK. Set the MACOS_RUNNER and XCODE_DEVELOPER_DIR repository
    # variables to use another runner or Xcode without editing this file.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      GH_TOKEN: ${{ github.token }}
      NATIVE_TEAM_ID: ${{ secrets.NATIVE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # build numbers and release notes come from history
          fetch-tags: true

      - name: Check for changes since the last nightly
        id: changes
        run: |
          last=$(git rev-parse --quiet --verify 'refs/tags/nightly^{commit}' || true)
          if [ "$last" = "$(git rev-parse HEAD)" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "main hasn't changed since the last nightly; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up signing
        if: steps.changes.outputs.skip != 'true'
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release/ci-signing.sh setup

      - name: Build, notarize and publish
        if: steps.changes.outputs.skip != 'true'
        run: scripts/release/release.sh --channel nightly --publish --ed-key-file "$SPARKLE_KEY_FILE"

      - name: Tear down signing
        if: always()
        run: scripts/release/ci-signing.sh teardown

  # TODO(linux): enable once the host core builds on Linux (docs/releasing.md, "Remote updates").
  # Each runner builds a static native-host for its architecture. To enable: set the
  # LINUX_HOST_BUILDS repository variable to true, add `needs: linux-host` to the job above,
  # download these artifacts into a folder there and set NATIVE_LINUX_HOST_DIR to it, so release.sh
  # signs them into the same host feed.
  linux-host:
    if: vars.LINUX_HOST_BUILDS == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Build native-host
        run: |
          swift build -c release --package-path Packages/NativeHost --product native-host --static-swift-stdlib
          cp "$(swift build -c release --package-path Packages/NativeHost --show-bin-path)/native-host" \
            "native-host-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-host-linux-${{ matrix.arch }}
          path: native-host-linux-${{ matrix.arch }}
