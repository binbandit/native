# Publishes a stable or beta release when a version tag is pushed: v1.4.0 is stable, v1.5.0-beta.1
# is beta. docs/releasing.md explains the release flow and the secrets this uses.
#
# Rehearse one without publishing anything: `gh workflow run release.yml --ref <branch> -f version=1.4.0`
# builds that branch as the version given, signs, notarizes and packages it and writes the appcast,
# then uploads the results as workflow artifacts. Tags and the beta scheduler publish.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: The version to rehearse, e.g. 1.4.0 or 1.5.0-beta.1 (nothing is published)
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        description: Version to publish from its existing v-prefixed tag
        type: string
        required: true
      publish:
        # A reusable call inherits its caller's event, which can also be workflow_dispatch.
        # Only calls get this default; the existing dispatch stays a rehearsal.
        type: boolean
        default: true
      notes_from:
        description: Previous published beta tag, or the last published stable tag for the first beta
        type: string
        default: ''
      notes_from_start:
        description: Include the whole history when no release has been published
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release${{ github.event_name != 'push' && !inputs.publish && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      GH_TOKEN: ${{ github.token }}
      NATIVE_TEAM_ID: ${{ secrets.NATIVE_TEAM_ID }}
      NATIVE_SENTRY_DSN: ${{ secrets.NATIVE_SENTRY_DSN }}
      NATIVE_SPARKLE_PUBLIC_KEY: ${{ vars.NATIVE_SPARKLE_PUBLIC_KEY }}
      NATIVE_RELEASE_NOTES_FROM: ${{ inputs.notes_from }}
      NATIVE_RELEASE_NOTES_FROM_START: ${{ inputs.notes_from_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.publish && format('refs/tags/v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the channel
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          case "$version" in
            *-beta.*) channel=beta ;;
            *) channel=stable ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # The terminal (libghostty, a Zig build of several minutes) and the script runtime's Cargo
      # build, V8 included. release.sh builds both before archiving; these keep that quick.
      - name: Cache libghostty
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/native-build/libghostty
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libghostty.sh') }}
          restore-keys: libghostty-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the script runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Native/ScriptRuntime
          key: script-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Runtime/ScriptRuntime/Cargo.lock', 'Runtime/ScriptRuntime/rust-toolchain.toml', 'scripts/build-script-runtime.sh') }}
          restore-keys: script-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up signing
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release/ci-signing.sh setup

      - name: Build, notarize and publish
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MODE: ${{ github.event_name != 'push' && !inputs.publish && '--rehearse' || '--publish' }}
        run: >-
          scripts/release/release.sh
          --channel "${{ steps.version.outputs.channel }}"
          --version "${{ steps.version.outputs.version }}"
          "$MODE" --ed-key-file "$SPARKLE_KEY_FILE"

      # What a rehearsal would have published, to download and check by hand (docs/releasing.md).
      - name: Upload the rehearsal
        if: github.event_name != 'push' && !inputs.publish && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ steps.version.outputs.version }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-release/${{ steps.version.outputs.channel }}/appcast/*.zip
            ${{ runner.temp }}/native-release/${{ steps.version.outputs.channel }}/appcast/*.delta
            ${{ runner.temp }}/native-release/${{ steps.version.outputs.channel }}/appcast/appcast.xml
            ${{ runner.temp }}/native-release/${{ steps.version.outputs.channel }}/host/
            ${{ runner.temp }}/native-release/${{ steps.version.outputs.channel }}/celebrations/
      - name: Tear down signing
        if: always() && steps.checkout.outcome == 'success'
        run: scripts/release/ci-signing.sh teardown

  # TODO(linux): enable once the host core builds on Linux (docs/releasing.md, "Remote updates").
  # Each runner builds a static native-host for its architecture. To enable: set the
  # LINUX_HOST_BUILDS repository variable to true, add `needs: linux-host` to the job above,
  # download these artifacts into a folder there and set NATIVE_LINUX_HOST_DIR to it, so release.sh
  # signs them into the same host feed.
  linux-host:
    if: vars.LINUX_HOST_BUILDS == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish && format('refs/tags/v{0}', inputs.version) || github.sha }}
      - name: Build native-host
        run: |
          swift build -c release --package-path Packages/NativeHost --product native-host --static-swift-stdlib
          cp "$(swift build -c release --package-path Packages/NativeHost --show-bin-path)/native-host" \
            "native-host-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-host-linux-${{ matrix.arch }}
          path: native-host-linux-${{ matrix.arch }}
