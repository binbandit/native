# Third-party code Native builds with: GitHub Actions, the Swift packages with remote dependencies,
# and the script runtime's crates. Version updates for packages and crates come monthly as one
# grouped pull request per ecosystem; security updates come as soon as there's an advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Sparkle and Sentry are pinned in the Xcode project, which Dependabot can't edit, so a bump here
  # also needs native.xcodeproj's exact requirement and Package.resolved updated in the same PR.
  # Update the companion lockfile too for shared packages. Grammar bumps need their copied queries checked
  # (Packages/CodeThemes/NOTICE.md).
  - package-ecosystem: swift
    directories:
      - /Packages/CodeThemes
      - /Packages/NativeDiagnostics
    schedule:
      interval: monthly
    ignore:
      # This tag omits src/parser.c and tree_sitter headers; keep the generated-files release.
      - dependency-name: github.com/alex-pinkus/tree-sitter-swift
        versions: ["0.7.4"]
      # These releases conditionally omit scanner.c when Xcode evaluates their manifests.
      - dependency-name: github.com/tree-sitter/tree-sitter-javascript
        versions: ["0.25.0"]
      - dependency-name: github.com/tree-sitter/tree-sitter-python
        versions: ["0.25.0"]
      - dependency-name: github.com/tree-sitter/tree-sitter-css
        versions: ["0.25.0"]
      - dependency-name: github.com/tree-sitter-grammars/tree-sitter-yaml
        versions: ["0.7.2"]
    groups:
      swift-packages:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /Runtime/ScriptRuntime
    schedule:
      interval: monthly
    ignore:
      # Bumped by hand, with the prebuilt library's SHA-256 pins in scripts/build-script-runtime.sh.
      - dependency-name: v8
    groups:
      script-runtime-crates:
        patterns: ["*"]
