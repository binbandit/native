.tst{position:relative;width:356px;display:flex;align-items:stretch;min-height:40px;border-radius:8px;background:var(--overlay);box-shadow:var(--modal);text-align:left}
.tst:after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--sep);pointer-events:none}
.tst .tm{flex:1;min-width:0;padding:12px 12px 12px 16px;font:400 12px/16px var(--sans);color:var(--t1);letter-spacing:-.12px;text-wrap:pretty}
.tst .tdv{width:1px;background:var(--sep);flex:none}
.tst .tz{display:flex;align-items:center;gap:6px;padding:0 14px;color:var(--t1);border-radius:0 8px 8px 0;flex:none;position:relative}
.tst .tz.h{background:var(--hover)}.tst .tz.p{background:var(--pressed)}
.tst .tz.f{outline:3px solid var(--focus);outline-offset:0;z-index:2}
.tst .tu{font:500 12px/1 var(--sans);letter-spacing:-.12px}
.tst .tk{font:400 10px/1 var(--mono);color:var(--t3)}
.tst .tk s{font-size:10px}
.tst .tcl{position:absolute;left:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border),0 1px 3px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--t2);z-index:3}
.tst.leave{opacity:.45;transform:translateY(4px)}

:root{--sans:Geist,-apple-system,sans-serif;--mono:"Geist Mono",monospace;--sym:-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:13px var(--sans)}h1,p{margin:20px}main{display:grid;grid-template-columns:388px 388px;width:776px;margin:20px}section{height:144px;padding:16px;background:var(--bg);color:var(--t2)}h2{font:12px var(--sans);font-weight:400;margin:0 0 20px}s.sy{text-decoration:none;font-family:var(--sym)}svg{display:block;flex:none}</style><h1>Item 03: Undo, as the toast's edge</h1><p>Toast CSS, content, tokens and state definitions extracted from the supplied polish.html. Light and dark are arranged like the app gallery.</p><main></main><script>
const ic=(n,s=16,sw=1.3)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>`;
const K=s=>s.replace(/([⌘⇧⌥⌃])/g,'<s class="sy">$1</s>');
function toast(o={}){
  const msg=o.msg||'Archived “Wrap diff lines at word boundaries”. Removed its worktree.';
  return `<div class="tst ${o.leave?'leave':''}" style="${o.style||''}">${o.close?`<span class="tcl">${ic('x',8,1.9)}</span>`:''}<div class="tm">${msg}</div><i class="tdv"></i><div class="tz ${o.zone||''}"><span class="tu">Undo</span>${o.kbd===false?'':`<span class="tk">${K('⌘')}Z</span>`}</div></div>`;
}
const TOASTKIT=[
  ['Rest','Two lines; Undo centered on the toast\'s full height.',{}],
  ['Hover','Undo washes; the close button appears in the corner; the timer holds.',{zone:'h',close:true}],
  ['Pressed','',{zone:'p',close:true}],
  ['Keyboard focus','The ring follows Undo\'s zone.',{zone:'f'}],
  ['One line','',{msg:'Pinned “Queue follow-ups while a turn runs”.'}],
  ['Without ⌘Z','GitHub\'s toasts: Undo works, ⌘Z doesn\'t take it back.',{msg:'Conversation resolved',kbd:false}],
  ['Three lines','The longest Native writes today.',{msg:'Archived “Sidebar polish”. Removed its worktree and branch, saving uncommitted work as a checkpoint.'}],
  ['iPad','The close button always shows; a downward swipe dismisses.',{close:true}],
];
document.querySelector('main').innerHTML=TOASTKIT.map(([name,detail,options])=>['light','dark'].map(theme=>`<section data-theme="${theme}"><h2>${name}</h2>${toast(options)}</section>`).join('')).join('');</script></html>
